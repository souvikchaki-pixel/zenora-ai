<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenora AI — Login & Access</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="flex items-center justify-center p-4">

  <div style="max-width: 420px; width: 100%; margin: 60px auto;" class="glass-card p-8 relative">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 class="text-gradient" style="font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px;">Zenora AI</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 4px;">Luxury Mind & Wellness Workspace</p>
    </div>

    <!-- Alert Message Box -->
    <div id="auth-alert" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; line-height: 1.4;"></div>

    <!-- Email/Password Form -->
    <form id="auth-form" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Email Address</label>
        <input type="email" id="email" class="input-field" style="margin-top: 6px;" required placeholder="name@domain.com">
      </div>
      <div>
        <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Password</label>
        <input type="password" id="password" class="input-field" style="margin-top: 6px;" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn-primary" id="auth-submit-btn" style="margin-top: 8px;">Sign In</button>
    </form>

    <div style="margin: 20px 0; text-align: center; color: var(--text-muted); font-size: 0.75rem; position: relative;">
      <span style="background: var(--bg-dark); padding: 0 10px; position: relative; z-index: 1;">OR CONTINUE WITH</span>
      <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--card-border); z-index: 0;"></div>
    </div>

    <!-- Social Login Buttons Container -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      
      <!-- 1. Google Auth Button -->
      <button id="google-auth-btn" type="button" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continue with Google
      </button>

      <!-- 2. GitHub Auth Button -->
      <button id="github-auth-btn" type="button" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s;">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <!-- 3. X / Twitter Auth Button -->
      <button id="twitter-auth-btn" type="button" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s;">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Continue with X (Twitter)
      </button>

    </div>

    <!-- Toggle Sign In / Sign Up Link -->
    <div style="text-align: center; margin-top: 24px; font-size: 0.85rem;">
      <a href="#" id="toggle-auth-mode" style="color: var(--cyan-accent); text-decoration: none; font-weight: 500;">Don't have an account? Sign Up</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/aurora-bg.js"></script>
  <script src="js/main.js"></script>
  <script>
    let isSignUpMode = false;
    const form = document.getElementById('auth-form');
    const toggleLink = document.getElementById('toggle-auth-mode');
    const submitBtn = document.getElementById('auth-submit-btn');
    const alertBox = document.getElementById('auth-alert');

    function showAlert(msg) {
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      hideAlert();
      isSignUpMode = !isSignUpMode;
      submitBtn.innerText = isSignUpMode ? 'Create Account' : 'Sign In';
      toggleLink.innerText = isSignUpMode ? 'Already have an account? Sign In' : "Don't have an account? Sign Up";
    });

    // Email & Password Submit Handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.innerText = isSignUpMode ? "Creating Account..." : "Signing In...";
      submitBtn.disabled = true;

      try {
        if (!window.supabaseClient) {
          throw new Error("Supabase client is not configured. Please check js/config.js.");
        }

        let authRes;
        if (isSignUpMode) {
          authRes = await window.supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin + '/age-selection.html'
            }
          });
        } else {
          authRes = await window.supabaseClient.auth.signInWithPassword({ email, password });
        }

        if (authRes.error) throw authRes.error;

        const user = authRes.data.user;
        if (!user) throw new Error("Check your email inbox to confirm your registration.");

        // Save local session backup
        localStorage.setItem('zenora_user', JSON.stringify({ id: user.id, email: user.email }));
        localStorage.setItem('zenora_user_session', JSON.stringify({ id: user.id, email: user.email }));

        // Upsert record into public.users table
        await window.supabaseClient.from('users').upsert({
          id: user.id,
          email: user.email,
          created_at: new Date()
        }, { onConflict: 'id' });

        // Route user based on profile completeness
        const { data: profile } = await window.supabaseClient
          .from('users')
          .select('age')
          .eq('id', user.id)
          .single();

        if (profile && profile.age) {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'age-selection.html';
        }
      } catch (err) {
        showAlert(err.message || "Authentication failed.");
        submitBtn.innerText = isSignUpMode ? 'Create Account' : 'Sign In';
        submitBtn.disabled = false;
      }
    });

    // Google OAuth Handler
    document.getElementById('google-auth-btn').addEventListener('click', async () => {
      hideAlert();
      try {
        if (!window.supabaseClient) throw new Error("Supabase client not initialized.");
        const { error } = await window.supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/age-selection.html' }
        });
        if (error) throw error;
      } catch (err) {
        showAlert(err.message || "Google Authentication failed.");
      }
    });

    // GitHub OAuth Handler
    document.getElementById('github-auth-btn').addEventListener('click', async () => {
      hideAlert();
      try {
        if (!window.supabaseClient) throw new Error("Supabase client not initialized.");
        const { error } = await window.supabaseClient.auth.signInWithOAuth({
          provider: 'github',
          options: { redirectTo: window.location.origin + '/age-selection.html' }
        });
        if (error) throw error;
      } catch (err) {
        showAlert(err.message || "GitHub Authentication failed.");
      }
    });

    // X / Twitter OAuth Handler
    document.getElementById('twitter-auth-btn').addEventListener('click', async () => {
      hideAlert();
      try {
        if (!window.supabaseClient) throw new Error("Supabase client not initialized.");
        const { error } = await window.supabaseClient.auth.signInWithOAuth({
          provider: 'twitter',
          options: { redirectTo: window.location.origin + '/age-selection.html' }
        });
        if (error) throw error;
      } catch (err) {
        showAlert(err.message || "X (Twitter) Authentication failed. Ensure Twitter OAuth 2.0 is enabled in Supabase.");
      }
    });
  </script>
</body>
</html>
