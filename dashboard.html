<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenora AI - Dashboard</title>
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --primary-hover: #1f6feb;
      --user-msg: #238636;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Layout */
    .sidebar {
      width: 250px;
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 30px;
    }

    .nav-links {
      list-style: none;
    }

    .nav-links li {
      margin-bottom: 15px;
    }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      display: block;
      padding: 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .nav-links a.active, .nav-links a:hover {
      background-color: #21262d;
      color: var(--primary);
    }

    .logout-btn {
      background: #da3633;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 15px 25px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Chat Container */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .message.ai-loading {
      align-self: flex-start;
      background-color: var(--card-bg);
      color: var(--text-muted);
      font-style: italic;
    }

    .message.error {
      align-self: flex-center;
      background-color: #5a1d1d;
      color: #ff9999;
    }

    /* Input Area */
    .chat-input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .chat-input-area input {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: var(--primary);
    }

    .chat-input-area button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-input-area button:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="brand">Zenora AI</div>
      <ul class="nav-links">
        <li><a href="#" class="active">Chat Assistant</a></li>
      </ul>
    </div>
    <button class="logout-btn" onclick="handleLogout()">Log Out</button>
  </aside>

  <!-- Main View -->
  <main class="main-content">
    <header>
      <h2>AI Workspace</h2>
    </header>

    <!-- Chat Interface -->
    <div class="chat-container">
      <div id="chat-messages" class="chat-messages">
        <div class="message ai">Hello! I am Zenora AI. How can I help you today?</div>
      </div>

      <form id="chat-form" class="chat-input-area">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ask Zenora anything..." 
          required 
          autocomplete="off" 
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
